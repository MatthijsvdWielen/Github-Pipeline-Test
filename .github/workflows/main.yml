name: Sync Simplifier to GitHub

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour, or change as needed
  workflow_dispatch: # Allows manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Important: Fetch all history so we can check for conflicts
          fetch-depth: 0 

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Firely Terminal
        run: dotnet tool install -g firely.terminal

      - name: Authenticate & Sync
        env:
          SIMPLIFIER_USERNAME: ${{ secrets.SIMPLIFIER_USERNAME }}
          SIMPLIFIER_PASSWORD: ${{ secrets.SIMPLIFIER_PASSWORD }}
          PROJECT_KEY: 'github-pipeline-project'
        run: |
          # Log in non-interactively
          fhir login --username "$SIMPLIFIER_USERNAME" --password "$SIMPLIFIER_PASSWORD"
          
          # Sync changes from Simplifier to this runner's local folder
          fhir project sync $PROJECT_KEY --force

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Simplifier Sync Bot"
          git config --global user.email "bot@yourdomain.com"
          
          # Only proceed if there are actual changes
          if [[ -n "$(git status --porcelain)" ]]; then
            git add .
            git commit -m "Automated sync from Simplifier.net"
            
            # Use --rebase to ensure we don't overwrite new GitHub commits 
            # made while the pipeline was running.
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes detected on Simplifier."
          fi
