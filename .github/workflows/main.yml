name: Sync Simplifier to GitHub

on:
  # schedule:
  #  - cron: '0 * * * *' # Runs every hour, or change as needed
  workflow_dispatch: # Allows manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Important: Fetch all history so we can check for conflicts
          fetch-depth: 0 

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Firely Terminal
        run: dotnet tool install -g firely.terminal





      - name: Authenticate & Sync
        env:
          SIMPLIFIER_USERNAME: ${{ secrets.SIMPLIFIER_USERNAME }}
          SIMPLIFIER_PASSWORD: ${{ secrets.SIMPLIFIER_PASSWORD }}
          PROJECT_KEY: 'Github-Pipeline-Project'
        run: |
          # Log in non-interactively
          fhir login email="$SIMPLIFIER_USERNAME" password="$SIMPLIFIER_PASSWORD"

          # Link the project
          fhir project link $PROJECT_KEY --strategy TakeRemote
          
          # Sync changes from Simplifier to this runner's local folder
          fhir project sync --strategy TakeRemote

      - name: Commit and Push Changes
        run: |
         git config --global user.name "Simplifier Sync Bot"
          git config --global user.email "bot@matthijs.com"

          # Stage everything first
          git add .

          # IMPORTANT: never commit GitHub Actions workflows from this bot
          git reset -- .github/workflows || true

          # FIX B: discard any workflow changes so the working tree is clean
          git checkout -- .github/workflows || true

          # Only proceed if there are actual changes left staged
          if [[ -n "$(git diff --cached --name-only)" ]]; then
            git commit -m "Automated sync from Simplifier.net"

            # Rebase onto the latest remote main, then push
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes detected on Simplifier (or only workflow files changed)."
          fi
