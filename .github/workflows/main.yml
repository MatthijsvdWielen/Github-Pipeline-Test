name: Sync Simplifier to GitHub

on:
  # schedule:
  #  - cron: '0 * * * *' # Runs every hour, or change as needed
  workflow_dispatch: # Allows manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Important: Fetch all history so we can check for conflicts
          fetch-depth: 0 

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Firely Terminal
        run: dotnet tool install -g firely.terminal





      - name: Authenticate & Sync
        env:
          SIMPLIFIER_USERNAME: ${{ secrets.SIMPLIFIER_USERNAME }}
          SIMPLIFIER_PASSWORD: ${{ secrets.SIMPLIFIER_PASSWORD }}
          PROJECT_KEY: 'Github-Pipeline-Project'
        run: |
          # Log in non-interactively
          fhir login email="$SIMPLIFIER_USERNAME" password="$SIMPLIFIER_PASSWORD"

          # Link the project
          fhir project link $PROJECT_KEY --strategy TakeRemote || true
          
          # Sync changes from Simplifier to this runner's local folder
          fhir project sync --strategy TakeRemote

      - name: Commit and Push IG Changes (guides only)
        run: |
          set -euo pipefail

          git config --global user.name "Simplifier Sync Bot"
          git config --global user.email "bot@matthijs.com"

          # Make sure workflow files are not modified locally (safety)
          git checkout -- .github/workflows || true

          # --- SAFEGUARD 1: Detect unexpected changes outside guides/ ---
          # List changed files (tracked) after sync
          CHANGED="$(git status --porcelain)"

          # If anything changed outside guides/, fail (or you can just ignore)
          if echo "$CHANGED" | awk '{print $2}' | grep -vE '^(guides/|$)' >/dev/null; then
            echo "Unexpected changes detected outside guides/. Refusing to commit."
            echo "Changed files:"
            git status --porcelain
            exit 1
          fi

          # --- SAFEGUARD 2: Only stage guides/ ---
          git add -- guides/

          # Commit only if there are staged changes
          if [[ -n "$(git diff --cached --name-only)" ]]; then
            git commit -m "Automated sync of Implementation Guide from Simplifier"

            git pull --rebase origin main
            git push origin main
          else
            echo "No guide changes detected."
          fi
